name: Setup
description: Install pnpm and Node, authenticate to GitHub Packages, and install dependencies.

inputs:
  node-auth-token:
    description: GitHub token with read:packages. Pass secrets.NODE_AUTH_TOKEN.
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # The repo has no .npmrc, so this step writes both lines: the @elirobinson
    # scope mapping and the token. Vercel gets the same two lines from the
    # team-shared NPM_RC env var instead (docs/agents/environment.md).
    #
    # `pnpm config set`, not an echo into ~/.npmrc, so this keeps working after a
    # pnpm major. pnpm 11 keeps its own credential store and sends tokens only
    # from there: a token in ~/.npmrc is still listed back in pnpm's own
    # "authorization settings were found" output while never reaching the
    # request, which surfaces as a 401 saying no authorization header was set.
    # `pnpm config set` writes wherever the running pnpm actually reads.
    #
    # The guard is here because an empty secret produces that same 401, and the
    # error names neither the secret nor the repo. Failing on the length turns a
    # confusing registry error into an actionable one.
    - name: Authenticate to GitHub Packages
      shell: bash
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "::error::NODE_AUTH_TOKEN is empty. Set it with:" \
               "gh secret set NODE_AUTH_TOKEN --repo ${{ github.repository }}" \
               "(a GitHub token with read:packages)."
          exit 1
        fi
        pnpm config set @elirobinson:registry https://npm.pkg.github.com
        pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
